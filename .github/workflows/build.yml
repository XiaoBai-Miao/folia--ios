name: Build Folia iOS (Direct-Connect)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Folia web (dist)
        run: |
          # 锁定到发光效果正常的版本（上游 PR #900 把多层 textShadow 改成单层，
          # 导致 iOS 上发光变成长方形）
          PIN=658a8bb2616e8a09ae57dc3f00baadf688006261
          git init folia && cd folia
          git remote add origin https://github.com/chthollyphile/folia-major.git
          git fetch --depth 1 origin $PIN
          git checkout FETCH_HEAD
          echo "checked out: $(git rev-parse --short HEAD)"
          npm ci || npm install
          npm run build
          test -d dist || { echo "dist not found"; ls; exit 1; }
          du -sh dist

      - name: Patch qishui provider (Electron IPC -> direct module)
        run: python3 inject/patch-provider.py folia/dist

      - name: Inject direct-connect modules
        run: |
          cp inject/qishui-direct.js folia/dist/qishui-direct.js
          cp inject/native-http.js folia/dist/native-http.js
          cp inject/keep-audio-alive.js folia/dist/keep-audio-alive.js
          python3 - <<'PY'
          import re
          p = 'folia/dist/index.html'
          s = open(p, encoding='utf-8').read()
          tags = ('<script src="/keep-audio-alive.js"></script>\n    '
                  '<script src="/qishui-direct.js"></script>\n    '
                  '<script src="/native-http.js"></script>\n  ')
          if 'qishui-direct.js' not in s:
              s = s.replace('<head>', '<head>\n    ' + tags, 1)
              open(p, 'w', encoding='utf-8').write(s)
          cur = open(p, encoding='utf-8').read()
          print('index.html injected:', 'qishui-direct.js' in cur, '| keep-audio:', 'keep-audio-alive.js' in cur)
          PY

      - name: Create Capacitor iOS shell
        run: |
          mkdir shell && cd shell
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "top.izuna.foliamajor",
            "appName": "Folia",
            "webDir": "www",
            "ios": { "contentInset": "never", "backgroundColor": "#09090b" },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF
          mkdir -p www
          cp -R ../folia/dist/* www/
          npx cap add ios
          npx cap sync ios


      - name: Inject Capacitor runtime into web bundle
        run: |
          cd shell
          # @capacitor/core 的浏览器 UMD 运行时
          ls node_modules/@capacitor/core/dist/ || true
          if [ -f node_modules/@capacitor/core/dist/capacitor.js ]; then
            cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
            echo "已拷贝 capacitor.js (UMD)"
          else
            echo "WARN: capacitor.js 未找到，尝试 index.js"
            cp node_modules/@capacitor/core/dist/index.js www/capacitor.js 2>/dev/null || echo "FAIL"
          fi
          ls -lh www/capacitor.js
          python3 - <<'PY'
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          tag = '<script src="/capacitor.js"></script>\n    '
          if 'capacitor.js' not in s:
              s = s.replace('<head>', '<head>\n    ' + tag, 1)
              open(p, 'w', encoding='utf-8').write(s)
          s2 = open(p, encoding='utf-8').read()
          print('capacitor.js 已注入:', 'capacitor.js' in s2)
          print('顺序检查:', s2.find('capacitor.js') < s2.find('qishui-direct.js'))
          PY
          # 关键：改完 www 必须重新同步到 ios 工程，否则不会进 IPA
          npx cap copy ios
          echo '--- 同步后的 ios 目录 ---'
          ls -l ios/App/App/public/capacitor.js
          grep -o 'capacitor.js' ios/App/App/public/index.html | head -2


      - name: Patch AppDelegate (background audio)
        run: |
          cd shell
          ls ios/App/App/
          python3 ../inject/patch-appdelegate.py ios/App/App
          echo '--- 结果 ---'
          grep -n "AVAudioSession" ios/App/App/AppDelegate.swift | head -5

      - name: Add custom HTTP plugin (bypass set-cookie filtering)
        run: |
          cd shell
          # 直接把插件类追加到 AppDelegate.swift 末尾（新文件不在 Xcode 工程里，编译不到）
          printf '\n\n' >> ios/App/App/AppDelegate.swift
          # 去掉 import 行（追加到文件中间，import 必须放在文件顶部）
          grep -v '^import ' ../inject/FoliaHttpPlugin.swift >> ios/App/App/AppDelegate.swift
          python3 ../inject/patch-appdelegate-plugin.py ios/App/App
          grep -c "FoliaHttpPlugin" ios/App/App/AppDelegate.swift

      - name: Patch Info.plist
        run: |
          P=shell/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Folia" "$P" 2>/dev/null || true

      - name: Inject CarPlay scene experiment
        run: |
          cd shell
          python3 ../inject/patch-carplay.py ios/App/App

      - name: Archive (unsigned)
        run: |
          cd shell/ios/App
          ARGS="-configuration Release -destination generic/platform=iOS -archivePath ../../../build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          if [ -d App.xcworkspace ]; then
            xcodebuild -workspace App.xcworkspace -scheme App $ARGS 2>&1 | tail -50
          else
            xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies || true
            xcodebuild -project App.xcodeproj -scheme App $ARGS 2>&1 | tail -50
          fi
          test -d ../../../build/App.xcarchive/Products/Applications/App.app

      - name: Assemble IPA
        run: |
          brew install ldid
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/Folia.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Folia" Payload/Folia.app/Info.plist
          cp shell/ios/App/App/CarPlay.entitlements ./CarPlay.entitlements && ldid -S./CarPlay.entitlements Payload/Folia.app/App
          zip -qry folia-ios-direct.ipa Payload
          ls -lh folia-ios-direct.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: folia-ios-direct
          path: folia-ios-direct.ipa

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=direct.$(date +%m%d%H%M)
          gh release create "$VER" folia-ios-direct.ipa \
            --title "Folia iOS Direct $VER" \
            --notes "汽水直连版（WebCrypto + CapacitorHttp），无需中转服务器。" || true


